<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eae5da">
  <meta name="robots" content="noindex,nofollow">
  <title>[タイトル]</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header class="site-header"><a href="#top">[タイトル]</a><span class="header-mark" aria-hidden="true"></span></header>
  <main id="top">
    <section class="welcome" aria-labelledby="welcome-title">
      <h1 id="welcome-title">[タイトル]</h1>
      <p class="intro-copy">[購入ありがとう的な文]</p>
      <div class="contents"><h2>内容物の確認</h2><p>[内容物一覧]</p></div>
      <div class="start-controls"><label class="confirmation"><input id="contents-confirmed" type="checkbox">内容物を確認しました</label>
      <button id="start" class="primary" disabled>次へ<span class="arrow" aria-hidden="true"></span></button></div>
    </section>
    <div id="journey"></div>
    <p id="global-status" role="status" aria-live="polite"></p>
    <button id="retry" class="text-button" hidden>読み込みを再試行</button>
    <noscript>このページを遊ぶにはJavaScriptを有効にしてください。</noscript>
  </main>
  <footer><button id="reset" class="text-button" hidden>最初からやり直す</button></footer>
  <dialog id="reset-dialog"><h2>最初からやり直しますか？</h2><p>この端末に保存した進行状況を消去します。</p><form method="dialog"><button value="cancel" autofocus>戻る</button><button value="reset">やり直す</button></form></dialog>
<dialog id="incomplete-dialog" role="alertdialog" aria-labelledby="incomplete-message"><p id="incomplete-message">すべての回答欄を埋める必要があります。</p><form method="dialog"><button autofocus>OK</button></form></dialog>
</body>
</html>
