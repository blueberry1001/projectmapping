<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eae5da">
  <meta name="robots" content="noindex,nofollow">
  <title>Projectmapping</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <main id="top">
    <div id="journey"></div>
    <p id="global-status" role="status" aria-live="polite"></p>
    <button id="retry" class="text-button" hidden>読み込みを再試行</button>
    <noscript>このページを遊ぶにはJavaScriptを有効にしてください。</noscript>
  </main>
  <footer><button id="reset" class="text-button" hidden>最初からやり直す</button></footer>
  <dialog id="reset-dialog"><h2>最初からやり直しますか？</h2><p>この端末に保存した進行状況を消去します。</p><form method="dialog"><button value="cancel" autofocus>戻る</button><button value="reset">やり直す</button></form></dialog>
<dialog id="incomplete-dialog" role="alertdialog" aria-labelledby="incomplete-message"><p id="incomplete-message">すべての解答欄を埋める必要があります。</p><form method="dialog"><button autofocus>OK</button></form></dialog>
  <!-- Set the hint destination here when the hint site is ready. -->
  <button class="hint-button" type="button" aria-label="ヒント（準備中）" aria-disabled="true" title="ヒント（準備中）">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18h6M10 21h4M9 15c0-2-4-3-4-7a7 7 0 0 1 14 0c0 4-4 5-4 7v1H9z"/><path d="M12 5a3 3 0 0 0-3 3"/></svg>
  </button>
</body>
</html>
